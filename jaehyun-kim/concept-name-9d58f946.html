:root{--char:#2F2F2F;--parch:#FAF9F5;--mint:#A5FAF4;--lime:#D3FF9D;--serif:'PP Kyoto',Georgia,'Times New Roman',serif;--sans:'PP Mori','Helvetica Neue',Arial,system-ui,sans-serif}
.slide{position:absolute;inset:0;width:1920px;height:1080px;background:var(--char);overflow:hidden;color:var(--parch);font-family:var(--sans)}
.slide.rtl .tb,.slide.rtl .cap{text-align:right}
.slide *{box-sizing:border-box}
.abs{position:absolute}
.bgart{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;user-select:none;opacity:.32}
.hrule{position:absolute;left:64px;right:64px;top:132px;height:1px;background:rgba(250,249,245,.38)}
.gicon{position:absolute;left:64px;top:36px;width:65px;height:65px;border-radius:15px;object-fit:cover}
.htitle{position:absolute;left:152px;top:36px;height:65px;line-height:65px;font:500 40px/65px var(--serif);max-width:1300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlogo{position:absolute;right:64px;top:52px;height:34px}
.foot{position:absolute;left:64px;bottom:28px;font-size:15px;opacity:.55;letter-spacing:.2px}
.nosh{position:absolute;right:64px;bottom:28px;max-width:960px;text-align:right;font-size:15px;opacity:.75;letter-spacing:.2px;text-shadow:0 0 8px #2F2F2F,0 0 3px #2F2F2F;pointer-events:none}
.ph{position:absolute}
.ph-frame{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
.ph-screen{position:absolute;overflow:hidden;background:#111}
.ph-screen img{width:100%;height:100%;display:block}
.cap{position:absolute;text-align:center;font-size:22px;line-height:1.4;color:rgba(250,249,245,.95);white-space:pre-wrap}
.capbox{position:relative;display:block;box-sizing:border-box;width:100%;background:rgba(14,14,14,.75);border-radius:16px;padding:8px 18px}
.tb{position:absolute}
.eyebrow{font:600 24px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mint)}
.big{font:500 124px/1.04 var(--serif);letter-spacing:-.5px}
.appicon{border-radius:92px;object-fit:cover;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.meta{display:flex;gap:100px}.meta small{display:block;font-size:14px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-bottom:6px}.meta b{font:500 30px var(--serif)}
.hint{position:absolute;right:70px;bottom:62px;display:flex;align-items:center;gap:12px;font-size:19px;opacity:.9}
.arw{display:flex;width:54px;height:54px;border:1px solid rgba(250,249,245,.5);border-radius:50%;align-items:center;justify-content:center}

.dbox,.panel{background:rgba(14,14,14,.75);border-radius:26px}
.dbox{position:relative;padding:26px 30px;margin-bottom:28px}
.dbox:last-child{margin-bottom:0}
.panel{border-radius:30px}
.dbox::before,.panel::before,.capbox::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:2.5px;background:#fff;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
.capbox::before{padding:2px}
.dbox .lbl{border-top:0;padding-top:0;margin-bottom:12px;color:#D3FF9D}
.dbox .emptyph{border:0;padding:0}
.txt.sm{font-size:24px;line-height:1.5}
.pill{display:inline-block;border:1px solid rgba(250,249,245,.55);border-radius:40px;padding:10px 26px;font:600 26px var(--sans);margin:4px 0 26px}
.cname{font:500 84px/1.05 var(--serif);margin-bottom:26px}
.lbl{font:600 26px var(--sans);border-top:1px solid rgba(250,249,245,.45);padding-top:16px;margin-bottom:14px}
.txt{font-size:26px;line-height:1.55;color:rgba(250,249,245,.92);white-space:pre-wrap}
.desc{font-size:36px;line-height:1.5;white-space:pre-wrap;color:rgba(250,249,245,.95)}
.emptyph{color:rgba(250,249,245,.5);font-style:italic}
.intro{padding:80px 90px;text-align:center;font-size:34px;line-height:1.5}.intro p{margin:0 0 30px}.intro p.b{font:500 44px var(--serif)}
.fbt{padding:46px 60px;text-align:center}.fbt b{font:500 40px var(--serif);display:block;margin-bottom:14px}.fbt p{margin:0;font-size:26px;line-height:1.5;opacity:.92}
.align{left:600px;top:470px;width:720px;padding:30px 44px 26px;background:var(--parch);border-radius:26px;color:var(--char);box-shadow:0 14px 50px rgba(0,0,0,.4)}
.aq{font:600 24px var(--sans);margin-bottom:46px}
.bar{position:relative;height:40px;margin:0 14px}
.track{position:absolute;left:0;right:0;top:18px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--mint),var(--lime))}
.tick{position:absolute;top:0;width:40px;height:40px;margin-left:-20px;border:0;background:none;padding:0;cursor:pointer}
.tick i{position:absolute;left:13px;top:13px;width:14px;height:14px;border-radius:50%;background:#c3c3c3;transition:.12s}
.tick:hover i,.tick.fill i{background:#36ADA5}
.tick.on i{width:26px;height:26px;left:7px;top:7px;background:#2F2F2F;box-shadow:0 0 0 5px var(--lime)}
.arv{text-align:center;font:700 22px var(--sans);color:#2F2F2F;margin-top:20px;min-height:26px}
.albl{display:flex;justify-content:space-between;font:600 16px var(--sans);margin-top:14px;color:#555}
.btn{display:block;text-align:center;background:var(--parch);border-radius:40px;padding:20px 24px;font:600 26px var(--sans);color:var(--char);text-decoration:none}
a.btn[href]:hover{background:var(--mint)}
.asset{text-align:center}.a1{font:500 44px var(--serif)}.a2{font-size:30px;margin:60px 0 30px;font-weight:600}.a3{display:block;font-size:26px;color:var(--mint);text-decoration:underline}


.vf{position:absolute;inset:0;background:#FAF9F5;box-shadow:0 14px 36px rgba(0,0,0,.45)}
.vf-screen{position:absolute;overflow:hidden;background:#111}.vf-screen img{width:100%;height:100%;display:block}
.sblabel{font:600 24px var(--sans);color:var(--mint)}
.sbsub{font:400 44px/1.2 var(--serif);color:rgba(250,249,245,.92)}
.dbox.sbc{padding:14px 18px;margin:0;border-radius:20px}.txt.sm22{font-size:22px;line-height:1.45}

.capbox,.dbox.sbc{background:rgba(14,14,14,.75);color:#fff}
.capbox::before,.dbox.sbc::before{background:#fff;padding:2px}
.dbox.sbc .txt,.dbox.sbc .sm22{color:#fff}
.dbox.sbc .emptyph{color:rgba(255,255,255,.55)}

html,body{margin:0;height:100%;background:#1c1c1c;overflow:hidden;font-family:var(--sans);color:#fff}
#stageBox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#scaler{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5);cursor:pointer}
#stage.cm{cursor:crosshair}
.navedge{position:fixed;z-index:40;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(38,38,38,.72);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font:26px/1 PP Mori,sans-serif;cursor:pointer;padding:0;transition:opacity .3s,background .15s}
.navedge:hover{background:rgba(70,70,70,.9)}
#navL{left:16px}#navR{right:16px}.idle .navedge{opacity:0}
.pin{position:absolute;width:44px;height:44px;margin:-44px 0 0 -22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#D3FF9D;color:#222;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20}
.pin span{transform:rotate(45deg);font:700 20px PP Mori,sans-serif}
.pin.res{background:#A5FAF4;opacity:.75}
.bar2{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(38,38,38,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:40px;padding:6px 10px;z-index:50;transition:opacity .4s;font-size:14px}
.bar2 button,.chips button,.drawer button,.pop button{font:600 14px PP Mori,sans-serif;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:8px 14px;cursor:pointer}
.bar2 button:hover,.chips button:hover,.drawer button:hover{background:rgba(255,255,255,.22)}
.bar2 button.on{background:#D3FF9D;color:#222;border-color:#D3FF9D}
.bar2 .ct{min-width:64px;text-align:center;opacity:.85}
.chips{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:94vw;background:rgba(38,38,38,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:6px 8px;z-index:50;transition:opacity .4s}
.chips button.on{background:#fff;color:#2F2F2F;border-color:#fff}
.idle .bar2,.idle .chips{opacity:0;pointer-events:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:340px;max-width:90vw;background:rgba(38,38,38,.97);border-left:1px solid rgba(255,255,255,.15);z-index:60;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer h3{margin:0;padding:16px;font:700 17px PP Mori;border-bottom:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:center}
.drawer .list{flex:1;overflow:auto;padding:10px}
.cm-item{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.4;cursor:pointer}
.cm-item small{opacity:.65;display:block;margin-bottom:4px}.cm-item.res{opacity:.5}
.cm-item .a{margin-top:8px;display:flex;gap:6px}.cm-item .a button{padding:4px 10px;font-size:12px}
.drawer .ft{padding:10px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:6px}
.pop{position:fixed;z-index:70;width:300px;background:#2f2f2f;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px;box-shadow:0 14px 50px rgba(0,0,0,.6)}
.pop input,.pop textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;padding:8px;font:14px PP Mori;margin-bottom:8px}
.pop textarea{height:84px;resize:vertical}.pop .r{display:flex;gap:6px;justify-content:flex-end}
.drawer{width:360px}
.bar2 .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#D3FF9D;color:#222;font-size:12px;line-height:18px;text-align:center}
.drawer .sync{padding:8px 16px;font-size:12px;opacity:.85;border-bottom:1px solid rgba(255,255,255,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:7px;vertical-align:middle}.dot.on{background:#18b26b}.dot.off{background:#e0a400}
.compose{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.compose .cslide{font:600 12px PP Mori,sans-serif;opacity:.7;margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.compose input,.compose textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;padding:9px;font:14px PP Mori,sans-serif;margin-bottom:8px}
.compose textarea{height:96px;resize:vertical}
.compose .r{display:flex;align-items:center;justify-content:space-between}.compose .hint2{font-size:11px;opacity:.55}
.drawer button.pri{background:#D3FF9D;color:#222;border-color:#D3FF9D}
.drawer .sec{font:600 11px PP Mori,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin:12px 4px 8px}
.drawer .empty{opacity:.55;font-size:13px;padding:4px 6px 8px}
.cm-item .tx{white-space:pre-wrap}
#stageBox{transition:right .25s}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#18b26b;color:#fff;padding:8px 18px;border-radius:20px;font:600 14px PP Mori;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>

const SCREEN_BY_KIND = { playable: { p: [640, 1138], l: [1138, 640] }, storyboard: { p: [640, 1138], l: [1138, 640] } };

const screenFor = (o, kind, type) => o === 'icon' ? [512, 512] : (type === 'orient' && o === 'p') ? [640, 1493] : SCREEN_BY_KIND[kind || 'playable'][o];
const screenText = (o, kind, type) => { const s = screenFor(o, kind, type); return s[0] + ' × ' + s[1] + ' px'; };
const KINDS = { playable: { label: 'Playable mock' }, storyboard: { label: 'Storyboard' } };
function fitInfo(orient, dims, kind, type) {   
  const sp = screenFor(orient, kind, type), want = sp[0] / sp[1], got = dims[0] / dims[1], diff = Math.abs(got - want) / want, SCREEN_TXT = screenText(orient, kind, type);
  const wrongWay = (dims[0] > dims[1]) !== (orient === 'l');
  if (wrongWay) return { ok: false, msg: 'This image is ' + (dims[0] > dims[1] ? 'landscape' : 'portrait') + ' (' + dims[0] + ' × ' + dims[1] + ' px) but this slot is ' + (orient === 'l' ? 'landscape' : 'portrait') + '. Use ' + SCREEN_TXT + ' or pick another layout.' };
  if (diff > 0.03) return { ok: false, msg: dims[0] + ' × ' + dims[1] + ' px does not match the screen ratio, so it will be cropped (or choose “Fit whole image”). Best size: ' + SCREEN_TXT + '.' };
  if (dims[0] < sp[0] * 0.85) return { ok: true, soft: true, msg: '✓ Right shape, but ' + dims[0] + ' × ' + dims[1] + ' px is lower than ' + SCREEN_TXT + ' and may look soft.' };
  return { ok: true, msg: '✓ ' + dims[0] + ' × ' + dims[1] + ' px — fills the whole phone.' };
}
